; VULNERABLE: this configuration is tuned specifically to reproduce the
; historical "LFI to RCE via session.upload_progress race condition"
; technique (patched in the PHP engine itself since 5.4.11 / 5.3.21, which
; is why this lab deliberately runs an older, unpatched PHP build).
;
; session.upload_progress.enabled lets a multipart upload write attacker
; data into the session's own storage file while the request is still in
; flight. cleanup = Off keeps that data in the file instead of erasing it
; once the request finishes. use_strict_mode = Off and use_only_cookies =
; Off let an attacker set the session ID themselves instead of only
; receiving one the server generated, which this technique depends on.
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.use_strict_mode = Off
session.use_only_cookies = Off

display_errors = On
error_reporting = E_ALL
