# ISOLATED LAB ENVIRONMENT. Never expose this outside the local machine.
services:
  php:
    build: ./php
    container_name: shoplab-php
    volumes:
      - ./src:/var/www/html
    command: >
      sh -c "mkdir -p /var/www/html/data /var/www/html/public/uploads &&
             chmod -R 777 /var/www/html/data /var/www/html/public/uploads &&
             php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: shoplab-nginx
    ports:
      # Bound to localhost only, so the lab is not reachable from the network
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
