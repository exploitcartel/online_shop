server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # VULNERABLE: PHP is executed everywhere, including inside public/uploads/
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# File inclusion lab: isolated PHP 5.4 service, see README "File inclusion lab"
server {
    listen 81;
    server_name localhost;

    root /var/www/legacy;
    index include_sink.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass legacy-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
