; Intentionally weak configuration, for the lab environment only
; VULNERABLE: errors are shown in the browser and reveal paths and internal details
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
expose_php = On

; VULNERABLE: session accepts client-supplied identifiers and the cookie has no HttpOnly or SameSite
session.use_strict_mode = 0
session.cookie_httponly = 0
session.cookie_samesite =

upload_max_filesize = 2M
post_max_size = 4M
